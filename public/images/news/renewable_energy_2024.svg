<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="energyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#065f46;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6ee7b7;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#energyGradient)"/>
  
  <!-- Sun -->
  <circle cx="650" cy="100" r="60" fill="url(#sunGradient)"/>
  <g stroke="#fbbf24" stroke-width="3" opacity="0.8">
    <line x1="650" y1="20" x2="650" y2="40"/>
    <line x1="650" y1="160" x2="650" y2="180"/>
    <line x1="570" y1="100" x2="590" y2="100"/>
    <line x1="710" y1="100" x2="730" y2="100"/>
    <line x1="595" y1="45" x2="605" y2="55"/>
    <line x1="695" y1="145" x2="705" y2="155"/>
    <line x1="705" y1="45" x2="695" y2="55"/>
    <line x1="605" y1="145" x2="595" y2="155"/>
  </g>
  
  <!-- Wind Turbines -->
  <g fill="#ffffff" opacity="0.9">
    <!-- Turbine 1 -->
    <rect x="148" y="300" width="4" height="200" />
    <g transform="translate(150, 300) rotate(45)">
      <ellipse cx="0" cy="-40" rx="3" ry="40" />
      <ellipse cx="35" cy="20" rx="3" ry="40" transform="rotate(120)"/>
      <ellipse cx="-35" cy="20" rx="3" ry="40" transform="rotate(240)"/>
    </g>
    
    <!-- Turbine 2 -->
    <rect x="248" y="320" width="4" height="180" />
    <g transform="translate(250, 320) rotate(90)">
      <ellipse cx="0" cy="-35" rx="3" ry="35" />
      <ellipse cx="30" cy="17" rx="3" ry="35" transform="rotate(120)"/>
      <ellipse cx="-30" cy="17" rx="3" ry="35" transform="rotate(240)"/>
    </g>
    
    <!-- Turbine 3 -->
    <rect x="348" y="310" width="4" height="190" />
    <g transform="translate(350, 310) rotate(180)">
      <ellipse cx="0" cy="-38" rx="3" ry="38" />
      <ellipse cx="33" cy="19" rx="3" ry="38" transform="rotate(120)"/>
      <ellipse cx="-33" cy="19" rx="3" ry="38" transform="rotate(240)"/>
    </g>
  </g>
  
  <!-- Solar Panels -->
  <g fill="#1f2937" stroke="#374151" stroke-width="2">
    <rect x="450" y="400" width="80" height="40" rx="2"/>
    <rect x="540" y="400" width="80" height="40" rx="2"/>
    <rect x="450" y="450" width="80" height="40" rx="2"/>
    <rect x="540" y="450" width="80" height="40" rx="2"/>
  </g>
  
  <!-- Solar panel grid lines -->
  <g stroke="#6b7280" stroke-width="1" opacity="0.7">
    <line x1="470" y1="400" x2="470" y2="440"/>
    <line x1="490" y1="400" x2="490" y2="440"/>
    <line x1="510" y1="400" x2="510" y2="440"/>
    <line x1="560" y1="400" x2="560" y2="440"/>
    <line x1="580" y1="400" x2="580" y2="440"/>
    <line x1="600" y1="400" x2="600" y2="440"/>
    <line x1="470" y1="450" x2="470" y2="490"/>
    <line x1="490" y1="450" x2="490" y2="490"/>
    <line x1="510" y1="450" x2="510" y2="490"/>
    <line x1="560" y1="450" x2="560" y2="490"/>
    <line x1="580" y1="450" x2="580" y2="490"/>
    <line x1="600" y1="450" x2="600" y2="490"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="550" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="bold">
    Sustainable Energy Initiative 2024
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="575" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" opacity="0.9">
    75% Clean Energy Milestone Achieved
  </text>
  
  <!-- Energy waves -->
  <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.4">
    <path d="M50 250 Q100 230 150 250 T250 250"/>
    <path d="M350 280 Q400 260 450 280 T550 280"/>
    <path d="M600 320 Q650 300 700 320 T800 320"/>
  </g>
</svg>