<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7dd3fc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="earthGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky Background -->
  <rect width="800" height="400" fill="url(#skyGradient)"/>
  
  <!-- Ground -->
  <rect x="0" y="400" width="800" height="200" fill="url(#earthGradient)"/>
  
  <!-- Earth Globe -->
  <g transform="translate(400, 200)">
    <circle cx="0" cy="0" r="80" fill="#3b82f6" opacity="0.8"/>
    <!-- Continents -->
    <g fill="#22c55e">
      <path d="M-30 -40 Q-10 -50 10 -40 Q30 -30 40 -10 Q30 10 10 20 Q-10 30 -30 20 Q-50 0 -30 -40"/>
      <path d="M-60 20 Q-40 10 -20 20 Q0 30 20 40 Q0 50 -20 40 Q-40 30 -60 20"/>
      <ellipse cx="50" cy="-30" rx="15" ry="25"/>
      <ellipse cx="-50" cy="40" rx="20" ry="15"/>
    </g>
    <!-- Atmosphere glow -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#7dd3fc" stroke-width="3" opacity="0.6"/>
  </g>
  
  <!-- Trees -->
  <g fill="#16a34a">
    <!-- Tree 1 -->
    <rect x="98" y="450" width="4" height="40"/>
    <circle cx="100" cy="440" r="20"/>
    
    <!-- Tree 2 -->
    <rect x="148" y="460" width="4" height="30"/>
    <circle cx="150" cy="450" r="15"/>
    
    <!-- Tree 3 -->
    <rect x="648" y="455" width="4" height="35"/>
    <circle cx="650" cy="445" r="18"/>
    
    <!-- Tree 4 -->
    <rect x="698" y="465" width="4" height="25"/>
    <circle cx="700" cy="455" r="12"/>
  </g>
  
  <!-- Factory with clean emissions -->
  <g transform="translate(200, 420)">
    <!-- Factory building -->
    <rect x="0" y="40" width="60" height="40" fill="#6b7280"/>
    <rect x="10" y="30" width="15" height="15" fill="#374151"/>
    <rect x="35" y="30" width="15" height="15" fill="#374151"/>
    
    <!-- Clean smokestacks -->
    <rect x="15" y="0" width="8" height="40" fill="#9ca3af"/>
    <rect x="37" y="0" width="8" height="40" fill="#9ca3af"/>
    
    <!-- Clean emissions (white clouds) -->
    <g fill="#ffffff" opacity="0.8">
      <circle cx="19" cy="-5" r="4"/>
      <circle cx="25" cy="-8" r="3"/>
      <circle cx="31" cy="-5" r="4"/>
      <circle cx="41" cy="-5" r="4"/>
      <circle cx="47" cy="-8" r="3"/>
      <circle cx="53" cy="-5" r="4"/>
    </g>
  </g>
  
  <!-- Wind turbines -->
  <g fill="#ffffff" opacity="0.9">
    <!-- Turbine 1 -->
    <rect x="548" y="420" width="4" height="60"/>
    <g transform="translate(550, 420) rotate(30)">
      <ellipse cx="0" cy="-25" rx="2" ry="25"/>
      <ellipse cx="22" cy="12" rx="2" ry="25" transform="rotate(120)"/>
      <ellipse cx="-22" cy="12" rx="2" ry="25" transform="rotate(240)"/>
    </g>
    
    <!-- Turbine 2 -->
    <rect x="598" y="430" width="4" height="50"/>
    <g transform="translate(600, 430) rotate(90)">
      <ellipse cx="0" cy="-20" rx="2" ry="20"/>
      <ellipse cx="17" cy="10" rx="2" ry="20" transform="rotate(120)"/>
      <ellipse cx="-17" cy="10" rx="2" ry="20" transform="rotate(240)"/>
    </g>
  </g>
  
  <!-- Solar panels -->
  <g fill="#1f2937" stroke="#374151" stroke-width="1">
    <rect x="300" y="470" width="40" height="20" rx="2"/>
    <rect x="350" y="470" width="40" height="20" rx="2"/>
    <rect x="325" y="450" width="40" height="20" rx="2"/>
  </g>
  
  <!-- Recycling symbol -->
  <g transform="translate(50, 450)" fill="#22c55e" opacity="0.8">
    <path d="M0 0 L15 -10 L10 -15 L-5 -5 L-10 0 L0 10 Z"/>
    <path d="M15 -10 L25 5 L30 0 L20 -15 L15 -20 L5 -10 Z"/>
    <path d="M25 5 L10 15 L15 20 L30 10 L35 5 L25 -5 Z"/>
    <circle cx="12.5" cy="0" r="15" fill="none" stroke="#22c55e" stroke-width="2"/>
  </g>
  
  <!-- Conference building -->
  <g transform="translate(250, 380)" fill="#e5e7eb" opacity="0.9">
    <rect x="0" y="0" width="100" height="60" rx="5"/>
    <rect x="10" y="10" width="15" height="15" fill="#3b82f6"/>
    <rect x="30" y="10" width="15" height="15" fill="#3b82f6"/>
    <rect x="50" y="10" width="15" height="15" fill="#3b82f6"/>
    <rect x="70" y="10" width="15" height="15" fill="#3b82f6"/>
    <text x="50" y="45" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="10" font-weight="bold">SUMMIT</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="550" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="bold">
    Global Climate Summit 2024
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="575" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" opacity="0.9">
    Historic Agreement on Carbon Neutrality
  </text>
  
  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.7">
    <ellipse cx="150" cy="100" rx="25" ry="15"/>
    <ellipse cx="170" cy="95" rx="20" ry="12"/>
    <ellipse cx="600" cy="80" rx="30" ry="18"/>
    <ellipse cx="625" cy="75" rx="25" ry="15"/>
  </g>
</svg>