<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#techGradient)"/>
  
  <!-- Circuit pattern -->
  <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.3">
    <path d="M100 100 L200 100 L200 200 L300 200"/>
    <path d="M400 150 L500 150 L500 250 L600 250"/>
    <path d="M150 300 L250 300 L250 400 L350 400"/>
    <path d="M500 350 L600 350 L600 450 L700 450"/>
    <circle cx="200" cy="100" r="8"/>
    <circle cx="300" cy="200" r="8"/>
    <circle cx="500" cy="150" r="8"/>
    <circle cx="600" cy="250" r="8"/>
  </g>
  
  <!-- AI Brain Icon -->
  <g transform="translate(300, 200)">
    <circle cx="100" cy="100" r="80" fill="#ffffff" opacity="0.9"/>
    <path d="M50 80 Q100 40 150 80 Q130 120 100 100 Q70 120 50 80" fill="#1e3a8a"/>
    <circle cx="80" cy="85" r="8" fill="#3b82f6"/>
    <circle cx="120" cy="85" r="8" fill="#3b82f6"/>
    <path d="M85 110 Q100 125 115 110" stroke="#1e3a8a" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="450" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="bold">
    Global Technology Summit 2024
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="480" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" opacity="0.9">
    AI Breakthrough Announcements
  </text>
  
  <!-- Tech elements -->
  <g fill="#ffffff" opacity="0.6">
    <rect x="50" y="50" width="30" height="30" rx="5"/>
    <rect x="720" y="520" width="30" height="30" rx="5"/>
    <polygon points="700,80 720,60 740,80 720,100"/>
    <polygon points="80,520 100,500 120,520 100,540"/>
  </g>
</svg>