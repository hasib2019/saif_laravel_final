<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="healthGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="dnaGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:0.7" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#healthGradient)"/>
  
  <!-- DNA Helix -->
  <g transform="translate(200, 100)">
    <!-- DNA backbone -->
    <path d="M0 0 Q50 50 0 100 Q-50 150 0 200 Q50 250 0 300 Q-50 350 0 400" 
          stroke="#ffffff" stroke-width="4" fill="none" opacity="0.8"/>
    <path d="M100 0 Q50 50 100 100 Q150 150 100 200 Q50 250 100 300 Q150 350 100 400" 
          stroke="#ffffff" stroke-width="4" fill="none" opacity="0.8"/>
    
    <!-- DNA base pairs -->
    <g stroke="#e0e7ff" stroke-width="2" opacity="0.9">
      <line x1="0" y1="25" x2="100" y2="25"/>
      <line x1="0" y1="75" x2="100" y2="75"/>
      <line x1="0" y1="125" x2="100" y2="125"/>
      <line x1="0" y1="175" x2="100" y2="175"/>
      <line x1="0" y1="225" x2="100" y2="225"/>
      <line x1="0" y1="275" x2="100" y2="275"/>
      <line x1="0" y1="325" x2="100" y2="325"/>
      <line x1="0" y1="375" x2="100" y2="375"/>
    </g>
    
    <!-- DNA nucleotides -->
    <g fill="#fbbf24">
      <circle cx="0" cy="25" r="6"/>
      <circle cx="100" cy="25" r="6"/>
      <circle cx="0" cy="125" r="6"/>
      <circle cx="100" cy="125" r="6"/>
      <circle cx="0" cy="225" r="6"/>
      <circle cx="100" cy="225" r="6"/>
      <circle cx="0" cy="325" r="6"/>
      <circle cx="100" cy="325" r="6"/>
    </g>
    <g fill="#10b981">
      <circle cx="0" cy="75" r="6"/>
      <circle cx="100" cy="75" r="6"/>
      <circle cx="0" cy="175" r="6"/>
      <circle cx="100" cy="175" r="6"/>
      <circle cx="0" cy="275" r="6"/>
      <circle cx="100" cy="275" r="6"/>
      <circle cx="0" cy="375" r="6"/>
      <circle cx="100" cy="375" r="6"/>
    </g>
  </g>
  
  <!-- Medical Cross -->
  <g transform="translate(500, 200)" fill="#ffffff" opacity="0.9">
    <rect x="40" y="20" width="20" height="80" rx="10"/>
    <rect x="20" y="40" width="60" height="20" rx="10"/>
    <circle cx="50" cy="50" r="15" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <!-- Molecular structures -->
  <g transform="translate(450, 350)" fill="#ffffff" opacity="0.7">
    <circle cx="0" cy="0" r="8"/>
    <circle cx="25" cy="15" r="6"/>
    <circle cx="50" cy="0" r="8"/>
    <circle cx="75" cy="15" r="6"/>
    <circle cx="100" cy="0" r="8"/>
    <line x1="8" y1="0" x2="17" y2="15" stroke="#ffffff" stroke-width="2"/>
    <line x1="33" y1="15" x2="42" y2="0" stroke="#ffffff" stroke-width="2"/>
    <line x1="58" y1="0" x2="67" y2="15" stroke="#ffffff" stroke-width="2"/>
    <line x1="83" y1="15" x2="92" y2="0" stroke="#ffffff" stroke-width="2"/>
  </g>
  
  <!-- Microscope -->
  <g transform="translate(50, 350)" fill="#e5e7eb" opacity="0.8">
    <!-- Base -->
    <rect x="0" y="80" width="80" height="10" rx="5"/>
    <!-- Stand -->
    <rect x="35" y="20" width="10" height="60"/>
    <!-- Eyepiece -->
    <rect x="30" y="15" width="20" height="8" rx="4"/>
    <!-- Objective -->
    <circle cx="40" cy="65" r="8" fill="#374151"/>
    <!-- Stage -->
    <rect x="20" y="50" width="40" height="5" rx="2"/>
  </g>
  
  <!-- Data visualization -->
  <g transform="translate(550, 80)" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6">
    <path d="M0 80 L20 60 L40 70 L60 40 L80 50 L100 20"/>
    <path d="M0 100 L20 85 L40 90 L60 70 L80 75 L100 60"/>
    <circle cx="20" cy="60" r="3" fill="#fbbf24"/>
    <circle cx="60" cy="40" r="3" fill="#10b981"/>
    <circle cx="100" cy="20" r="3" fill="#ef4444"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="520" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="bold">
    Gene Therapy Breakthrough 2024
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="545" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" opacity="0.9">
    Revolutionary Treatment Shows 95% Success Rate
  </text>
  
  <!-- Medical particles -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="100" cy="150" r="2"/>
    <circle cx="150" cy="180" r="1.5"/>
    <circle cx="650" cy="120" r="2"/>
    <circle cx="700" cy="160" r="1.5"/>
    <circle cx="80" cy="250" r="1"/>
    <circle cx="720" cy="300" r="2"/>
  </g>
</svg>