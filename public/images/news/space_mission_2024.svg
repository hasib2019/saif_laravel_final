<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="spaceGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#312e81;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="planetGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Space Background -->
  <rect width="800" height="600" fill="url(#spaceGradient)"/>
  
  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="100" cy="80" r="1.5"/>
    <circle cx="200" cy="120" r="1"/>
    <circle cx="350" cy="90" r="1.5"/>
    <circle cx="450" cy="150" r="1"/>
    <circle cx="600" cy="100" r="1.5"/>
    <circle cx="750" cy="130" r="1"/>
    <circle cx="80" cy="200" r="1"/>
    <circle cx="300" cy="180" r="1.5"/>
    <circle cx="500" cy="220" r="1"/>
    <circle cx="700" cy="190" r="1.5"/>
    <circle cx="150" cy="300" r="1"/>
    <circle cx="400" cy="320" r="1.5"/>
    <circle cx="650" cy="280" r="1"/>
    <circle cx="50" cy="400" r="1.5"/>
    <circle cx="250" cy="450" r="1"/>
    <circle cx="550" cy="420" r="1.5"/>
    <circle cx="720" cy="480" r="1"/>
  </g>
  
  <!-- Planet Mars -->
  <circle cx="650" cy="150" r="80" fill="url(#planetGradient)"/>
  <g fill="#d97706" opacity="0.6">
    <ellipse cx="630" cy="130" rx="15" ry="8"/>
    <ellipse cx="670" cy="160" rx="12" ry="6"/>
    <ellipse cx="640" cy="180" rx="10" ry="5"/>
  </g>
  
  <!-- Rocket -->
  <g transform="translate(300, 350)">
    <!-- Rocket body -->
    <rect x="45" y="0" width="10" height="80" fill="#e5e7eb" rx="5"/>
    <!-- Rocket nose -->
    <polygon points="45,0 55,0 50,-15" fill="#dc2626"/>
    <!-- Rocket fins -->
    <polygon points="40,70 45,80 45,60" fill="#374151"/>
    <polygon points="55,60 55,80 60,70" fill="#374151"/>
    <!-- Rocket flames -->
    <g fill="#f59e0b" opacity="0.8">
      <polygon points="47,80 50,95 53,80"/>
      <polygon points="46,80 50,100 54,80"/>
    </g>
    <g fill="#dc2626" opacity="0.6">
      <polygon points="48,80 50,90 52,80"/>
    </g>
  </g>
  
  <!-- Satellite -->
  <g transform="translate(150, 200)">
    <!-- Satellite body -->
    <rect x="20" y="20" width="20" height="15" fill="#6b7280" rx="2"/>
    <!-- Solar panels -->
    <rect x="10" y="22" width="8" height="11" fill="#1f2937"/>
    <rect x="42" y="22" width="8" height="11" fill="#1f2937"/>
    <!-- Antenna -->
    <line x1="30" y1="20" x2="30" y2="10" stroke="#e5e7eb" stroke-width="2"/>
    <circle cx="30" cy="10" r="2" fill="#dc2626"/>
  </g>
  
  <!-- Earth (partial view) -->
  <g transform="translate(-50, 400)">
    <path d="M0 200 Q100 150 200 200 L200 250 Q100 200 0 250 Z" fill="#3b82f6"/>
    <path d="M20 220 Q60 200 100 220 Q140 200 180 220" fill="#10b981"/>
    <g fill="#ffffff" opacity="0.3">
      <ellipse cx="50" cy="230" rx="15" ry="8"/>
      <ellipse cx="120" cy="225" rx="20" ry="10"/>
    </g>
  </g>
  
  <!-- Mission trajectory -->
  <path d="M350 430 Q500 300 650 230" stroke="#fbbf24" stroke-width="3" fill="none" stroke-dasharray="10,5" opacity="0.7"/>
  
  <!-- Title -->
  <text x="400" y="520" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="bold">
    Mars Mission 2024 Success
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="545" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" opacity="0.9">
    Historic Landing Achieved
  </text>
  
  <!-- Cosmic dust -->
  <g fill="#fbbf24" opacity="0.3">
    <circle cx="400" cy="250" r="1"/>
    <circle cx="420" cy="270" r="0.5"/>
    <circle cx="380" cy="280" r="1"/>
    <circle cx="440" cy="290" r="0.5"/>
  </g>
</svg>